# observability-mcp app only — PLG data plane is mcp-central-docs/monitoring (12000–12006).
# Do not run the legacy bundled Grafana/Prometheus/Loki stack on 3000/9091/3100.

version: '3.8'

services:
  observability-mcp:
    build: .
    ports:
      - "12009:12009"  # Process Prometheus /metrics (PROMETHEUS_PORT)
    environment:
      - PROMETHEUS_PORT=12009
      - MCP_PORT=12007
      - GRAFANA_URL=http://host.docker.internal:12000
      - LOKI_URL=http://host.docker.internal:12002
      - PROMETHEUS_SERVER_URL=http://host.docker.internal:12001
      - OTEL_SERVICE_NAME=observability-mcp
      - METRICS_RETENTION_DAYS=30
      - MCP_DATA_DIR=/app/data
    volumes:
      - observability_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12009/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  observability_data:
    driver: local
