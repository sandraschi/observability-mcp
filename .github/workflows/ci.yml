# Lightweight CI: one job, ruff + pytest (no coverage HTML, no MCPB, no npm).
# MCPB + release assets: .github/workflows/mcpb-release.yml (tags only).
# Full web build: `just build` locally.

name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "llms*.txt"
      - "archive/**"
      - ".cursor/**"
      - "_dashboard/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "llms*.txt"
      - "archive/**"
      - ".cursor/**"
      - "_dashboard/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (test extras only)
        run: uv sync --extra test --frozen

      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Pytest
        run: uv run pytest tests -q --no-cov
